name: check

# Deliberately main-only. The `broken` branch is the repo's own first
# demonstration — its property test is SUPPOSED to fail there — and a red
# check on it would read as "this repo's CI is broken" to anyone skimming
# past. See README for how to see that failure locally instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: make check (typecheck spec, compile oracle, build + test Go)
        run: nix develop --command make check

  # The no-Nix door. The image is built FROM the flake, so it cannot carry
  # a different Agda or stdlib than `nix develop` does; it is then proved
  # by running the whole check inside it with no Nix present, and only
  # then pushed. Push events only reach here from main (see `on:` above).
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build the image from the flake
        run: nix build .#image && docker load < result

      - name: Prove it — make check inside the image, no Nix
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/yovico-ai/agda-guardrails:latest make check

      # skopeo pushes straight from the archive nix built. Going through
      # `docker load` + `docker push` instead ends in GHCR rejecting the
      # manifest with "unknown blob" after every layer has uploaded.
      # --inputs-from . pins skopeo to the same nixpkgs as the flake.
      - name: Push to GHCR
        env:
          DEST_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c result > /tmp/image.tar
          for tag in latest "${GITHUB_SHA::7}"; do
            nix shell --inputs-from . nixpkgs#skopeo -c \
              skopeo copy --dest-creds "$DEST_CREDS" \
                docker-archive:/tmp/image.tar "docker://ghcr.io/yovico-ai/agda-guardrails:$tag"
          done
